[project]
name = "neurosense-eeg"
version = "0.2.0"
description = "Clinical EEG Diagnostic Workstation & 1-Page Medical Report Generator"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "python-multipart>=0.0.9",
    "reportlab>=4.1.0",
    "pillow>=10.0.0",
    "numpy>=1.26.0",
    "scipy>=1.12.0",
    "matplotlib>=3.8.0",
    "httpx>=0.27.0",
    "pypdf>=4.0.0",
    "playwright>=1.40.0",
]

[tool.uv]
package = false
